@keyframes pulse{50%{opacity:.42}}
@keyframes orbit{to{transform:rotate(360deg)}}
.sigil{animation:ignite 4s ease-in-out infinite}@keyframes ignite{40%{stroke:#fc8da6;fill:#432436}}
