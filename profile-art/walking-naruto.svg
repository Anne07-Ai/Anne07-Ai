<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 208" font-family="system-ui, sans-serif" role="img">
<title>Naruto walks in a loop. Keep learning. Keep shipping.</title>
<defs>
  <linearGradient id="base" x2="1" y2="1"><stop stop-color="#0f1421"/><stop offset="1" stop-color="#171e30"/></linearGradient>
  <linearGradient id="edge"><stop stop-color="#9b5931"/><stop offset=".53" stop-color="#324257"/><stop offset="1" stop-color="#466e99"/></linearGradient>
  <linearGradient id="gold"><stop stop-color="#ffe0a8"/><stop offset=".55" stop-color="#ffbb78"/><stop offset="1" stop-color="#ec8f53"/></linearGradient>
  <linearGradient id="shine"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="#c8e0ff" stop-opacity=".36"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  <radialGradient id="mana"><stop stop-color="#e7a45d" stop-opacity=".3"/><stop offset="1" stop-color="#e7a45d" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#95a9c8" opacity=".16"/></pattern>
</defs>
<style>
.mono{font-family:monospace}
.float{animation:float 4s ease-in-out infinite}
.sweep{animation:sweep 5s ease-in-out infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
.orbit{animation:orbit 10s linear infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes sweep{0%,14%{transform:translateX(-320px);opacity:0}25%,65%{opacity:.7}80%,100%{transform:translateX(650px);opacity:0}}
@keyframes pulse{50%{opacity:.42}}
@keyframes orbit{to{transform:rotate(360deg)}}

.headline,.line,.contact-label,.closing{transform-box:fill-box;transform-origin:left center;animation:word 7.5s ease-in-out infinite}
@keyframes word{0%,100%{opacity:1;transform:translateY(0)}48%{opacity:.72;transform:translateY(2px)}60%{opacity:1;transform:translateY(0)}}

.route{animation:route 9s ease-in-out infinite}
.direction{animation:direction 9s step-end infinite}
.bounce{animation:bounce .56s ease-in-out infinite}
.leg{animation:stride .56s ease-in-out infinite}
.leg.far,.arm{animation:stride .56s ease-in-out -.28s infinite}
@keyframes route{0%,100%{transform:translateX(-66px)}50%{transform:translateX(66px)}}
@keyframes direction{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.direction{transform-origin:0 72px}
@keyframes bounce{50%{transform:translateY(-2px)}}
@keyframes stride{0%,100%{transform:rotate(19deg)}50%{transform:rotate(-20deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g class="route" transform-origin="520px 76px">
      <g transform="translate(518 12)">
       <ellipse cx="0" cy="129" rx="25" ry="4" fill="#8497bd" opacity=".22"/>
       <g class="direction">
        <g class="bounce">
         <g transform="translate(-4 92)"><g class="leg far">
          <path d="M-3 0h12l-1 19-3 11H-5l2-14Z" fill="#b36631" stroke="#1a243d" stroke-width="2"/>
          <path d="M-5 27H6l7 5v4H-7Z" fill="#243b66" stroke="#101c34" stroke-width="2"/>
         </g></g>
         <g transform="translate(5 92)"><g class="leg near">
          <path d="M-7 0H8L7 16l-3 15H-8l3-16Z" fill="#ec8c35" stroke="#1a243d" stroke-width="2"/>
          <path d="M-8 28H4l8 5v4H-10Z" fill="#315180" stroke="#101c34" stroke-width="2"/>
          <path d="M-6 30H5M-7 34H8" stroke="#6c8ab3" stroke-width="1.2"/>
         </g></g>
         <path d="M-10 58Q-6 52 7 56l10 9-2 28H-13l-3-24Z" fill="#e97c2d" stroke="#18213b" stroke-width="2.5"/>
         <path d="M-12 60l23-1 4 8-28 1ZM0 68v22" fill="#263858" stroke="#263858" stroke-width="2.5"/>
         <g transform="translate(-7 68)"><g class="arm">
          <path d="M-7 0Q-2-5 5-1l1 17-2 6H-6l-2-8Z" fill="#f19a49" stroke="#18213b" stroke-width="2"/>
          <circle cy="23" r="4.5" fill="#efbc88" stroke="#18213b" stroke-width="1.4"/>
         </g></g>
         <path d="M-28 36l-9-13 14 1-11-15 19 4-3-13 17 8L10 0l2 13 14-4-4 12 14 2-10 8-2 17H-24Z" fill="#f4cb5b" stroke="#836124" stroke-width="2"/>
         <path d="M-22 28Q0 17 22 29v7l5 6-4 4v7Q15 62-2 59-16 55-23 44Z" fill="#f2c289" stroke="#5a4638" stroke-width="2"/>
         <path d="M-26 25Q0 21 25 28v10Q1 30-25 36Z" fill="#293e66" stroke="#19263e" stroke-width="1.5"/>
         <path d="M-24 30l-15 8 14-1-12 9 14-6Z" fill="#324e80"/>
         <path d="M7 26l15 3v7L7 33Z" fill="#a7b5c7" stroke="#52627a" stroke-width="1.4"/>
         <path d="M11 30q4-4 7 0-1 2-4 1" fill="none" stroke="#52627a" stroke-width="1.1"/>
         <ellipse cx="14" cy="41" rx="2" ry="3" fill="#3d6b96"/>
         <path d="m6 44 4 1m-5 2 4 1m-5 2 4 1m8 0 5-1" stroke="#a16c4b" stroke-width="1.1" stroke-linecap="round"/>
        </g>
       </g>
      </g>
    </g><text x="520" y="186" fill="#d89e72" font-size="22" font-weight="700" text-anchor="middle" class="closing">Keep learning. Keep shipping.</text></svg>